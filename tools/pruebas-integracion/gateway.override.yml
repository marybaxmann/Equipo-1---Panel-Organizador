# Override LOCAL del API Gateway (repo backendticketU de la plataforma, que no se modifica).
# Reemplaza su .env (que no viene en el repo) por la configuracion de la red compartida. Lo usa levantar-ambiente.ps1.
services:
  gateway:
    env_file: !reset []
    environment:
      PORT: "8080"
      # Frontend Unificado (:3000) y frontend propio del Panel (:5173)
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      PROXY_TIMEOUT_MS: "5000"
      # Auth escucha en el 10000 dentro de la red (su .env.example dice 3000)
      AUTH_SERVICE_URL: http://auth-service:10000
      ENTRADAS_SERVICE_URL: http://entradas-service:3000
      ORGANIZADOR_SERVICE_URL: http://organizador-service:3000
      CATALOGO_SERVICE_URL: http://catalogo-service:3000
      PAGOS_SERVICE_URL: http://pagos-service:3000
      CHECKIN_SERVICE_URL: http://checkin-service:3000
      RESENAS_SERVICE_URL: http://resenas-service:3000
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:3000
      PROMOCIONES_SERVICE_URL: http://promociones-service:3000
